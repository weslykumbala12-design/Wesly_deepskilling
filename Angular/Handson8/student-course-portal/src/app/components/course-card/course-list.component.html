<h2>Courses</h2>

<div *ngIf="isLoading">
Loading...
</div>

<div *ngIf="errorMessage">
{{errorMessage}}
</div>

<table border="1">

<tr>
<th>ID</th>
<th>Title</th>
<th>Credits</th>
</tr>

<tr *ngFor="let c of courses">

<td>{{c.id}}</td>
<td>{{c.title}}</td>
<td>{{c.credits}}</td>

</tr>

</table>
